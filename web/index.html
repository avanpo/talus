<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume - talus</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --emerald: #16a34a;
            --amber: #d97706;
            --rose: #e11d48;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon { font-size: 1.5rem; }
        .brand-badge {
            font-size: 0.7rem;
            background-color: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .nav-link {
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text-main);
            background-color: var(--bg-subtle);
        }

        .nav-link.active {
            color: #fff;
            background-color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--emerald);
        }
        .status-dot.syncing {
            background-color: var(--amber);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .btn-sync {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-sync:hover {
            background-color: var(--bg-subtle);
            border-color: var(--border-light);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            flex: 1;
        }

        .controls-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: inline-flex;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px;
        }

        .btn-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.35rem 0.85rem;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-toggle:hover { color: var(--text-main); }
        .btn-toggle.active {
            background-color: var(--bg-card);
            color: var(--primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            font-weight: 600;
        }

        .select-input {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        .select-input:focus { border-color: var(--primary); }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .kpi-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .kpi-val {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        .kpi-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .chart-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }
        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="brand">
                <span class="brand-icon">⛰️</span>
                <span>talus</span>
                <span class="brand-badge">Telemetry</span>
            </a>
            <nav>
                <a href="/" class="nav-link active">Volume</a>
                <a href="/progress" class="nav-link">Fitness & Progress</a>
            </nav>
            <div class="header-actions">
                <div class="status-pill" id="statusPill">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Checking...</span>
                </div>
                <button class="btn-sync" id="btnSync" onclick="triggerSync()">Sync Now</button>
            </div>
        </div>
    </header>

    <main>
        <div class="controls-card">
            <div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap;">
                <div class="btn-group" id="periodGroup">
                    <button class="btn-toggle" data-period="week" onclick="setPeriod('week')">Weekly</button>
                    <button class="btn-toggle active" data-period="month" onclick="setPeriod('month')">Monthly</button>
                    <button class="btn-toggle" data-period="year" onclick="setPeriod('year')">Yearly</button>
                </div>

                <select class="select-input" id="sportSelect" onchange="loadStats()">
                    <option value="cardio" selected>All Cardio</option>
                    <option value="run">All Running</option>
                    <option value="trail">Trail Running</option>
                    <option value="road">Road Running</option>
                    <option value="treadmill">Treadmill Running</option>
                    <option value="hike">Hiking &amp; Walking</option>
                    <option value="ride">All Cycling</option>
                    <option value="gravel">Gravel Cycling</option>
                    <option value="mtb">Mountain Biking</option>
                    <option value="virtual_ride">Virtual Cycling</option>
                    <option value="ski_tour">Backcountry Skiing</option>
                    <option value="all">All Sports</option>
                </select>

                <select class="select-input" id="yearSelect" onchange="loadStats()">
                    <option value="0">All Years</option>
                </select>
            </div>
        </div>

        <!-- Volume Chart 1: Distance -->
        <div class="chart-card">
            <div class="chart-header">
                <h3 class="chart-title" id="distChartTitle">Distance</h3>
            </div>
            <div class="chart-container">
                <canvas id="distChart"></canvas>
            </div>
        </div>

        <!-- Volume Chart 2: Elevation -->
        <div class="chart-card">
            <div class="chart-header">
                <h3 class="chart-title" id="elevChartTitle">Elevation Gain</h3>
            </div>
            <div class="chart-container">
                <canvas id="elevChart"></canvas>
            </div>
        </div>

        <!-- Volume Chart 3: Time -->
        <div class="chart-card">
            <div class="chart-header">
                <h3 class="chart-title">Moving Time</h3>
            </div>
            <div class="chart-container">
                <canvas id="timeChart"></canvas>
            </div>
        </div>

        <!-- Total Stats KPI Grid -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <span class="kpi-title">Total Distance</span>
                <span class="kpi-val" id="kpiDist">-</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Elevation Gain</span>
                <span class="kpi-val" id="kpiElev">-</span>
                <span class="kpi-sub" id="kpiSubVert">Vert ratio: -</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-title">Moving Time</span>
                <span class="kpi-val" id="kpiTime">-</span>
                <span class="kpi-sub" id="kpiSubTime">Activities: -</span>
            </div>
        </div>
    </main>

    <footer>
        talus • Local endurance telemetry and training analytics
    </footer>

    <script>
        let currentPeriod = 'month';
        let distChartInstance = null;
        let elevChartInstance = null;
        let timeChartInstance = null;
        let initialYearsLoaded = false;

        // Outrun / Vaporwave palette (ordered by volume/rank in each graph: 1st gets #0, 2nd gets #1, etc.)
        const outrunPalette = [
            '#f72585', // 0: Hot Neon Magenta (Rank 1 / Largest Volume)
            '#00b4d8', // 1: Cyber Cyan / Aqua (Rank 2)
            '#7209b7', // 2: Electric Deep Purple (Rank 3)
            '#ff5400', // 3: Sunset Neon Orange (Rank 4)
            '#00f5d4', // 4: Laser Glacial Teal (Rank 5)
            '#ffd60a', // 5: Cyber Sun Gold
            '#4361ee', // 6: Retro Synth Cobalt
            '#b5179e', // 7: Neon Orchid Rose
            '#06d6a0'  // 8: Neon Mint
        ];

        function getColor(cat, idx) {
            if (cat === 'Other') return '#6c757d'; // Vapor Slate Gray for Other
            return outrunPalette[idx % outrunPalette.length];
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) return;
                const data = await res.json();
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const btn = document.getElementById('btnSync');

                if (data.is_syncing) {
                    dot.className = 'status-dot syncing';
                    text.innerText = 'Syncing...';
                    btn.disabled = true;
                    btn.innerText = 'Syncing...';
                } else {
                    dot.className = 'status-dot';
                    text.innerText = data.last_sync_ago ? 'Synced ' + data.last_sync_ago : 'Not synced yet';
                    btn.disabled = false;
                    btn.innerText = 'Sync Now';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function triggerSync() {
            const btn = document.getElementById('btnSync');
            btn.disabled = true;
            btn.innerText = 'Starting...';
            try {
                await fetch('/api/sync', { method: 'POST' });
                setTimeout(updateStatus, 500);
            } catch (e) {
                alert('Failed to trigger sync: ' + e);
                updateStatus();
            }
        }

        function setPeriod(p) {
            currentPeriod = p;
            document.querySelectorAll('#periodGroup .btn-toggle').forEach(b => {
                b.classList.toggle('active', b.dataset.period === p);
            });
            loadStats();
        }

        async function loadStats() {
            const sport = document.getElementById('sportSelect').value;
            const year = document.getElementById('yearSelect').value;

            try {
                const res = await fetch(`/api/stats?period=${currentPeriod}&sport=${sport}&year=${year}`);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();

                const distUnit = data.unit || 'km';
                const elevUnit = distUnit === 'mi' ? 'ft' : 'm';

                document.getElementById('distChartTitle').innerText = `Distance (${distUnit})`;
                document.getElementById('elevChartTitle').innerText = `Elevation Gain (${elevUnit})`;

                if (!initialYearsLoaded && data.years && data.years.length > 0) {
                    const select = document.getElementById('yearSelect');
                    const currVal = select.value;
                    select.innerHTML = '<option value="0">All Years</option>' + 
                        data.years.map(y => `<option value="${y}">${y}</option>`).join('');
                    select.value = currVal;
                    initialYearsLoaded = true;
                }

                // Update KPI Cards
                const tot = data.total;
                document.getElementById('kpiDist').innerText = tot.distance ? `${tot.distance.toLocaleString()} ${distUnit}` : `0 ${distUnit}`;
                document.getElementById('kpiElev').innerText = tot.elevation ? `${tot.elevation.toLocaleString()} ${elevUnit}` : `0 ${elevUnit}`;
                document.getElementById('kpiSubVert').innerText = `Vert ratio: ${tot.vert_ratio} ${elevUnit}`;
                document.getElementById('kpiTime').innerText = tot.moving_time_fmt || '0m';
                document.getElementById('kpiSubTime').innerText = `Activities: ${tot.count}`;

                // Render the 3 Volume Charts
                renderVolumeCharts(data.periods, data.total ? data.total.breakdowns : null, distUnit, elevUnit);
            } catch (e) {
                console.error(e);
            }
        }

        function buildGraphDatasets(periods, totalBreakdowns, metricKey) {
            // 1. Calculate total contribution of each category across all periods
            const catTotals = {};
            if (totalBreakdowns && typeof totalBreakdowns === 'object') {
                for (const [cat, bd] of Object.entries(totalBreakdowns)) {
                    if (bd && typeof bd[metricKey] === 'number') {
                        catTotals[cat] = bd[metricKey];
                    }
                }
            } else {
                for (const p of periods) {
                    if (!p.breakdowns) continue;
                    for (const [cat, bd] of Object.entries(p.breakdowns)) {
                        const val = bd[metricKey] || 0;
                        if (val > 0) {
                            catTotals[cat] = (catTotals[cat] || 0) + val;
                        }
                    }
                }
            }

            // 2. Separate "Other" from regular categories so "Other" always stacks at the top
            const nonOtherCats = Object.keys(catTotals).filter(cat => cat !== 'Other');
            // Sort non-Other categories descending by total volume (largest volume first)
            nonOtherCats.sort((a, b) => catTotals[b] - catTotals[a]);

            // 3. Max 5 categories; if more than 5, roll up everything else into "Other"
            let topCats = [];
            const otherCats = new Set();
            if (catTotals['Other'] > 0) {
                otherCats.add('Other');
            }

            if (nonOtherCats.length <= 5) {
                topCats = nonOtherCats;
            } else {
                topCats = nonOtherCats.slice(0, 5);
                for (let i = 5; i < nonOtherCats.length; i++) {
                    otherCats.add(nonOtherCats[i]);
                }
            }

            // 4. Build datasets for the top categories:
            // In Chart.js, datasets[0] renders at the bottom of the stacked bar (baseline),
            // datasets[1] renders above it, and so forth, guaranteeing largest volume at the bottom.
            const datasets = topCats.map((cat, idx) => ({
                label: cat,
                data: periods.map(p => (p.breakdowns && p.breakdowns[cat]) ? p.breakdowns[cat][metricKey] : 0),
                backgroundColor: getColor(cat, idx),
                stack: 'volume',
                categoryPercentage: 0.85,
                barPercentage: 0.92
            }));

            // 5. Append "Other" dataset at the end:
            // The last dataset in datasets[] renders at the very TOP of the stacked bar.
            if (otherCats.size > 0) {
                datasets.push({
                    label: 'Other',
                    data: periods.map(p => {
                        let sum = 0;
                        if (p.breakdowns) {
                            for (const cat of otherCats) {
                                if (p.breakdowns[cat]) {
                                    sum += p.breakdowns[cat][metricKey] || 0;
                                }
                            }
                        }
                        return Math.round(sum * 10) / 10;
                    }),
                    backgroundColor: getColor('Other', 99),
                    stack: 'volume',
                    categoryPercentage: 0.85,
                    barPercentage: 0.92
                });
            }

            return datasets;
        }

        function renderVolumeCharts(periods, totalBreakdowns, distUnit, elevUnit) {
            const labels = periods.map(p => p.label || p.key);

            // 1. Build Distance Datasets (max 5 + Other, ordered by contribution)
            const distDatasets = buildGraphDatasets(periods, totalBreakdowns, 'distance');

            // 2. Build Elevation Datasets (max 5 + Other, ordered by contribution)
            const elevDatasets = buildGraphDatasets(periods, totalBreakdowns, 'elevation');

            // 3. Build Moving Time Datasets (max 5 + Other, ordered by contribution)
            const timeDatasets = buildGraphDatasets(periods, totalBreakdowns, 'moving_time_hrs');

            // Render Chart 1: Distance
            const ctxDist = document.getElementById('distChart').getContext('2d');
            if (distChartInstance) {
                distChartInstance.data.labels = labels;
                distChartInstance.data.datasets = distDatasets;
                distChartInstance.options.scales.y.title.text = `Distance (${distUnit})`;
                distChartInstance.update('none');
            } else {
                distChartInstance = new Chart(ctxDist, {
                    type: 'bar',
                    data: { labels, datasets: distDatasets },
                    options: createChartOptions(`Distance (${distUnit})`, val => `${val.toLocaleString()} ${distUnit}`)
                });
            }

            // Render Chart 2: Elevation
            const ctxElev = document.getElementById('elevChart').getContext('2d');
            if (elevChartInstance) {
                elevChartInstance.data.labels = labels;
                elevChartInstance.data.datasets = elevDatasets;
                elevChartInstance.options.scales.y.title.text = `Elevation (${elevUnit})`;
                elevChartInstance.update('none');
            } else {
                elevChartInstance = new Chart(ctxElev, {
                    type: 'bar',
                    data: { labels, datasets: elevDatasets },
                    options: createChartOptions(`Elevation (${elevUnit})`, val => `${val.toLocaleString()} ${elevUnit}`)
                });
            }

            // Render Chart 3: Time
            const ctxTime = document.getElementById('timeChart').getContext('2d');
            if (timeChartInstance) {
                timeChartInstance.data.labels = labels;
                timeChartInstance.data.datasets = timeDatasets;
                timeChartInstance.update('none');
            } else {
                timeChartInstance = new Chart(ctxTime, {
                    type: 'bar',
                    data: { labels, datasets: timeDatasets },
                    options: createChartOptions('Moving Time (hrs)', val => `${val} hrs`)
                });
            }
        }

        function createChartOptions(yAxisTitle, tooltipFormatter) {
            return {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                normalized: true,
                interaction: { mode: 'index', intersect: false },
                categoryPercentage: 0.85,
                barPercentage: 0.92,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            color: '#334155',
                            font: { size: 12, weight: 600 },
                            boxWidth: 14,
                            boxHeight: 10,
                            padding: 14
                        }
                    },
                    tooltip: {
                        backgroundColor: '#0f172a',
                        titleColor: '#f8fafc',
                        bodyColor: '#e2e8f0',
                        footerColor: '#38bdf8',
                        padding: 10,
                        cornerRadius: 6,
                        titleFont: { size: 12, weight: 700 },
                        bodyFont: { size: 12 },
                        footerFont: { size: 12, weight: 700 },
                        boxPadding: 4,
                        itemSort: function(a, b) {
                            return b.parsed.y - a.parsed.y;
                        },
                        callbacks: {
                            label: function(context) {
                                const val = context.parsed.y;
                                if (val === 0) return null;
                                return ` ${context.dataset.label}: ${tooltipFormatter(val)}`;
                            },
                            footer: function(tooltipItems) {
                                let total = 0;
                                tooltipItems.forEach(item => {
                                    total += item.parsed.y || 0;
                                });
                                total = Math.round(total * 10) / 10;
                                if (total === 0) return null;
                                return `Total: ${tooltipFormatter(total)}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        categoryPercentage: 0.85,
                        barPercentage: 0.92,
                        ticks: {
                            color: '#64748b',
                            font: { size: 11 },
                            autoSkip: true,
                            maxTicksLimit: 20,
                            maxRotation: 0
                        },
                        grid: { display: false }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        ticks: { color: '#64748b', font: { size: 11 } },
                        grid: { color: '#f1f5f9' },
                        title: { display: true, text: yAxisTitle, color: '#475569', font: { size: 12, weight: 600 } }
                    }
                }
            };
        }

        setInterval(updateStatus, 15000);
        updateStatus();
        loadStats();
    </script>
</body>
</html>
